openapi: 3.0.3
info:
  title: TransactionOS Transaction API
  version: 2.0.0
paths:
  /properties:
    post: {summary: Create property}
  /properties/{propertyId}:
    get: {summary: Get normalized property}
  /transactions:
    post: {summary: Create transaction}
  /transactions/{transactionId}:
    get: {summary: Get transaction workspace}
  /transactions/{transactionId}/offers:
    post: {summary: Create offer}
