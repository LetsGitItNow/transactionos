    post: {summary: Decline current offer version}
  /offers/{offerId}/withdraw:
    post: {summary: Withdraw offer where permitted}
  /offers/{offerId}/history:
    get: {summary: Get immutable offer version history}
  /transactions/{transactionId}/events:
    get: {summary: Get audit events}
  /transactions/{transactionId}/documents:
    get: {summary: Get transaction documents}
  /transactions/{transactionId}/deadlines:
    get: {summary: Get transaction deadlines}
  /transactions/{transactionId}/signatures:
    get: {summary: Get signature evidence}
